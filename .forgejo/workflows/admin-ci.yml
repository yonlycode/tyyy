# tyyy — CI admin (app desktop Wails v3, Forgejo Actions, migré depuis
# .github/workflows/admin-ci.yml).
#
# ⚠️ LINUX ONLY — choix assumé : les runners de la fleet sont Linux/Docker
#    uniquement (act/docker, label `ubuntu-latest`). macOS exige un runner
#    macOS (matériel Apple, inexistant ici) et le cross-build Windows/Wails
#    (WebView2, .syso, NSIS) est hors périmètre. Les builds macOS/Windows
#    restent des builds LOCAUX (`task package` sur la machine cible) — cf.
#    README. C'est la raison pour laquelle l'ancienne release GitHub
#    (matrice macos/linux/windows) est réduite à la matrice Linux seule.
#
# Playbook fleet (validé live, NE PAS "moderniser") :
#   * runs-on: ubuntu-latest = label EXACT du runner act/docker — tout autre
#     label = run `waiting` éternel ;
#   * les steps `uses:` (actions JS) tournent avec node DANS le conteneur du
#     job → image node:22 COMPLÈTE (node + git + curl embarqués : node est
#     disponible AVANT toute step `uses:`, contrairement à golang:* qui
#     nécessiterait un step 0 d'install node — et l'apt golang de bookworm
#     est un 1.19 trop vieux pour go.mod (1.26) ; Go est posé par
#     actions/setup-go qui lit admin/go.mod, comme l'ancienne CI) ;
#   * cert auto-signé Traefik (Forgejo interne) → git http.sslVerify false +
#     NODE_TLS_REJECT_UNAUTHORIZED=0 pour les actions JS ;
#   * act lance les scripts en bash -e -o pipefail → jamais de pipe terminal ;
#   * actions/upload-artifact en v3 max (v4 = GHESNotSupportedError).
#
# Dépendances système : Wails v3 (beta.0, tag par défaut) compile en CGO
# contre GTK4 + WebKitGTK 6.0 (vérifié dans le module : #cgo pkg-config:
# gtk4 webkitgtk-6.0) + appindicator + rsvg — les templates fleet
# (Karulab/ci-shared go-ci.yml) ne les ont pas → workflow dédié justifié.
# build-essential (gcc) est requis : CGO, et `task build` bascule sur un
# build Docker cross sinon (impossible sous le runner act).
name: Admin CI

"on":
  push:
    branches: [main]
    paths: ["admin/**"]
  pull_request:
    paths: ["admin/**"]

env:
  NODE_TLS_REJECT_UNAUTHORIZED: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:22
    defaults:
      run:
        shell: bash
        working-directory: ./admin
    steps:
      - name: git sans vérif TLS (cert auto-signé Traefik)
        run: git config --global http.sslVerify false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Dépendances système (toolchain C + GTK4/WebKit6)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Go (version = admin/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod

      - name: Install wails3 + task
        run: |
          # wails3 épinglé sur la version du module (admin/go.mod :
          # github.com/wailsapp/wails/v3 v3.0.0-beta.0) — l'ancienne CI
          # faisait @latest ; épingler évite la dérive CLI/bibliothèque.
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.0
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set app icon
        run: cp -f assets/appicon.png build/appicon.png

      - name: Install frontend dependencies
        working-directory: ./admin/frontend
        run: yarn install --frozen-lockfile

      # task build → linux:build → build:native (gcc présent) :
      # go mod tidy + build:frontend (yarn build + wails3 generate bindings)
      # + generate:icons + .desktop + go build -tags production (CGO GTK4).
      # Équivalent de `wails3 build` de l'ancienne CI (vérifié localement).
      - name: Build Linux (task build)
        run: task build

      - name: Vérif binaires
        run: |
          ls -l bin/tyyy-admin
          od -c -N 4 bin/tyyy-admin

      - name: Vet
        run: go vet ./...

      # go build ./... n'est PAS utilisable tel quel : build/ios (scaffold
      # Wails iOS) est un package main sans func main hors GOOS=ios → erreur
      # de link. go vet ./... (sans link) passe, et `go build .` +
      # `go build ./pkg/...` couvrent le code réel.
      - name: Build packages Go
        run: |
          go build .
          go build ./pkg/...

      # Erreurs de format préexistantes sur main (main.go, build/ios) :
      # informatif, non bloquant (même politique que le lint de web-ci).
      - name: Check formatting (non bloquant — erreurs préexistantes sur main)
        continue-on-error: true
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"
