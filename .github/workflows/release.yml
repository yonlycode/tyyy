name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: "tyyy-admin"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            platform: darwin/arm64
            artifact: "tyyy-admin-${{ github.ref_name }}-macos-arm64"
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
            artifact: "tyyy-admin-${{ github.ref_name }}-linux-amd64.AppImage"
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            artifact: "tyyy-admin-${{ github.ref_name }}-windows-amd64.exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: admin/frontend/yarn.lock

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: ./admin/frontend
        run: yarn install --frozen-lockfile

      - name: Set app icon
        shell: bash
        run: cp -f "${{ github.workspace }}/admin/assets/appicon.png" build/appicon.png

      - name: Build
        run: wails3 build

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Wails builds a macOS .app bundle; extract the self-contained
          # executable (frontend is embedded via //go:embed) instead of zipping.
          cp "build/bin/tyyy-admin.app/Contents/MacOS/tyyy-admin" "build/bin/${{ matrix.artifact }}"
          chmod +x "build/bin/${{ matrix.artifact }}"

      - name: Package Linux (AppImage)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ARCH=x86_64
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$ARCH.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          mv squashfs-root appimagetool-dir
          mkdir -p appdir
          cp build/bin/tyyy-admin appdir/AppRun
          chmod +x appdir/AppRun
          printf '[Desktop Entry]\nType=Application\nName=Tyyy Admin\nComment=yo-port admin CMS\nIcon=app\nCategories=Utility;\n' > appdir/tyyy-admin.desktop
          cp "${{ github.workspace }}/admin/assets/appicon.png" appdir/app.png
          ./appimagetool-dir/AppRun appdir "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"
          mkdir -p build/bin && mv "${{ matrix.artifact }}" build/bin/

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ./admin/build/bin
        run: Copy-Item tyyy-admin.exe "${{ matrix.artifact }}"

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: admin/build/bin/${{ matrix.artifact }}

  build-android:
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: admin/frontend/yarn.lock

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.3.11579264"

      - name: Install frontend dependencies
        working-directory: ./admin/frontend
        run: yarn install --frozen-lockfile

      - name: Build Android APK
        run: wails3 task android:package

      - name: Upload Android APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: admin/bin/tyyy-admin.apk
